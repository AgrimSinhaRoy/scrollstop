<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#04050d">
<title>ScrollBye — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --bg:#04050d;--surface:#0a0c1a;--surface2:#111326;
  --border:rgba(255,255,255,0.06);--border-hover:rgba(108,99,255,0.4);
  --accent:#6C63FF;--accent2:#FF6B6B;--accent3:#43E97B;--accent4:#00D2FF;
  --text:#EEEEFF;--muted:rgba(220,220,255,0.42);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}

/* BACKGROUND */
#star-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.55;}
.grid-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(108,99,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(108,99,255,0.025) 1px,transparent 1px);
  background-size:80px 80px;}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(120px);}
.orb1{width:700px;height:700px;background:radial-gradient(circle,rgba(108,99,255,0.16),transparent 70%);top:-250px;left:-250px;animation:od1 22s ease-in-out infinite alternate;}
.orb2{width:500px;height:500px;background:radial-gradient(circle,rgba(255,107,107,0.11),transparent 70%);bottom:-120px;right:-120px;animation:od2 28s ease-in-out infinite alternate;}
.orb3{width:400px;height:400px;background:radial-gradient(circle,rgba(0,210,255,0.09),transparent 70%);top:45%;left:55%;animation:od3 20s ease-in-out infinite alternate;}
@keyframes od1{0%{transform:translate(0,0)}100%{transform:translate(70px,90px)}}
@keyframes od2{0%{transform:translate(0,0)}100%{transform:translate(-60px,-70px)}}
@keyframes od3{0%{transform:translate(0,0)}100%{transform:translate(-50px,60px)}}

/* LOGO */
.nav-logo-wrap{position:relative;display:inline-block;width:52px;height:52px;flex-shrink:0;}
.nav-logo-inner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.52);transform-origin:center center;width:100px;height:100px;}
.logo-glow-nav{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(108,99,255,0.25),transparent 70%);opacity:0.6;pointer-events:none;animation:haloBreath 3s ease-in-out infinite;}
@keyframes haloBreath{0%,100%{transform:scale(1);opacity:0.5}50%{transform:scale(1.15);opacity:0.9}}
.logo-svg-wrap{position:relative;width:100px;height:100px;display:flex;align-items:center;justify-content:center;}
.logo-ring{position:absolute;border-radius:50%;border:1.5px solid transparent;}
.lr1{inset:0;border-color:rgba(108,99,255,0.7) transparent transparent transparent;animation:spin 3.5s linear infinite;}
.lr2{inset:10px;border-color:transparent rgba(0,210,255,0.6) transparent transparent;animation:spin 5s linear infinite reverse;}
.lr3{inset:20px;border-color:rgba(67,233,123,0.5) transparent transparent transparent;animation:spin 8s linear infinite;}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.logo-core-circle{position:absolute;inset:28px;border-radius:50%;background:linear-gradient(135deg,#1a1040,#0a2040);border:2px solid rgba(108,99,255,0.5);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(108,99,255,0.2),0 0 30px rgba(108,99,255,0.5),0 0 60px rgba(108,99,255,0.2),inset 0 1px 0 rgba(255,255,255,0.15);animation:corePulse 2.5s ease-in-out infinite;overflow:hidden;}
@keyframes corePulse{0%,100%{box-shadow:0 0 0 1px rgba(108,99,255,0.2),0 0 25px rgba(108,99,255,0.5),0 0 50px rgba(108,99,255,0.2),inset 0 1px 0 rgba(255,255,255,0.1);}50%{box-shadow:0 0 0 2px rgba(108,99,255,0.4),0 0 50px rgba(108,99,255,0.8),0 0 100px rgba(108,99,255,0.4),inset 0 1px 0 rgba(255,255,255,0.2);}}
.logo-icon-svg{width:26px;height:26px;position:relative;z-index:1;}
.logo-core-circle::after{content:'';position:absolute;top:-100%;left:0;right:0;height:100%;background:linear-gradient(transparent,rgba(108,99,255,0.15),transparent);animation:scanline 3s ease-in-out infinite;}
@keyframes scanline{0%{top:-100%}100%{top:200%}}
.logo-orbit-dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--accent3);box-shadow:0 0 12px var(--accent3);top:50%;left:0;transform-origin:50px 0;animation:orbitDot 4s linear infinite;}
@keyframes orbitDot{0%{transform:translateY(-50%) rotate(0deg) translateX(46px) rotate(0deg);}100%{transform:translateY(-50%) rotate(360deg) translateX(46px) rotate(-360deg);}}
.logo-orbit-dot2{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2);top:50%;left:0;transform-origin:50px 0;animation:orbitDot2 6s linear infinite reverse;}
@keyframes orbitDot2{0%{transform:translateY(-50%) rotate(0deg) translateX(46px) rotate(0deg);}100%{transform:translateY(-50%) rotate(360deg) translateX(46px) rotate(-360deg);}}

/* NAVBAR */
.navbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 2.5rem;height:64px;background:rgba(4,5,13,0.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.nav-brand{display:flex;align-items:center;gap:6px;text-decoration:none;}
.nav-brand-text{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:var(--text);}
.nav-links{display:flex;align-items:center;gap:0.25rem;}
.nav-hamburger{display:none;background:transparent;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:var(--text);padding:6px 10px;font-size:18px;cursor:pointer;}
.nav-link{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;transition:all 0.2s;}
.nav-link:hover{color:var(--text);background:rgba(255,255,255,0.04);}
.nav-link.active{color:var(--text);background:rgba(108,99,255,0.15);border:1px solid rgba(108,99,255,0.3);}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid rgba(108,99,255,0.4);flex-shrink:0;}
.nav-avatar-initial{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent4));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:white;border:2px solid rgba(108,99,255,0.4);flex-shrink:0;}
.nav-logout-btn{padding:7px 18px;border-radius:100px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;background:transparent;border:1px solid rgba(255,107,107,0.35);color:rgba(255,150,150,0.8);cursor:pointer;transition:all 0.2s;text-decoration:none;}
.nav-logout-btn:hover{background:rgba(255,107,107,0.12);border-color:var(--accent2);color:#fff;}

/* PAGE */
.page-wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:80px 1rem 3rem;}
.section-eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:1.25rem;}
.eyebrow-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.card{background:rgba(10,12,26,0.65);border:1px solid var(--border);border-radius:20px;backdrop-filter:blur(20px);padding:1.5rem;transition:border-color 0.25s;margin-bottom:1.25rem;}
.card:hover{border-color:rgba(108,99,255,0.3);}

/* LOADING */
#prof-loading{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.spinner{width:44px;height:44px;border-radius:50%;border:3px solid rgba(108,99,255,0.2);border-top-color:var(--accent);animation:spin 0.8s linear infinite;}
.loading-text{font-family:'Syne',sans-serif;font-size:14px;color:var(--muted);}

/* PROFILE HERO */
.profile-hero{display:flex;align-items:center;gap:2rem;margin-bottom:2rem;flex-wrap:wrap;}
.avatar-wrap{position:relative;flex-shrink:0;width:120px;height:120px;}
#avatar-display{
  width:120px;height:120px;border-radius:50%;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.avatar-img,.avatar-initial-lg{
  width:120px;height:120px;border-radius:50%;object-fit:cover;
  display:block;
  border:3px solid rgba(108,99,255,0.5);
  box-shadow:0 0 0 4px rgba(108,99,255,0.15),0 0 40px rgba(108,99,255,0.3);
}
.avatar-initial-lg{
  background:linear-gradient(135deg,var(--accent),var(--accent4));
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:800;font-size:44px;color:#fff;
}
.avatar-camera-overlay{
  position:absolute;inset:0;border-radius:50%;
  background:rgba(4,5,13,0.55);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity 0.2s;cursor:pointer;
  font-size:24px;
}
.avatar-wrap:hover .avatar-camera-overlay{opacity:1;}
#avatar-file-input{display:none;}
.upload-status{font-size:12px;color:var(--accent3);margin-top:8px;min-height:16px;text-align:center;}

.profile-info{flex:1;min-width:200px;}
.profile-username{font-family:'Syne',sans-serif;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;color:var(--text);margin-bottom:0.5rem;}
.xp-level-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:100px;background:rgba(108,99,255,0.15);border:1px solid rgba(108,99,255,0.35);font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:rgba(180,175,255,0.95);margin-bottom:1rem;}
.xp-pip{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.profile-joined{font-size:13px;color:var(--muted);}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:1.25rem;}
.stat-tile{background:rgba(10,12,26,0.65);border:1px solid var(--border);border-radius:18px;padding:1.2rem 1rem;text-align:center;transition:border-color 0.25s,transform 0.2s;}
.stat-tile:hover{border-color:rgba(108,99,255,0.3);transform:translateY(-2px);}
.stat-tile-label{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.stat-tile-value{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;line-height:1;color:var(--text);}
.stat-tile-sub{font-size:11px;color:var(--muted);margin-top:4px;}
.accent-green{color:var(--accent3);}
.accent-purple{color:var(--accent);}
.accent-blue{color:var(--accent4);}
.accent-gold{color:#FFD700;}

/* XP BAR */
.xp-bar-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;}
.xp-bar-track{height:8px;border-radius:100px;background:rgba(255,255,255,0.06);overflow:hidden;}
.xp-bar-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--accent),var(--accent4));width:0%;transition:width 0.9s ease;}

/* CHART CARD */
.chart-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:1rem;}
.chart-wrap{position:relative;height:180px;}

/* BADGE GRID */
.badge-section-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:1rem;}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1rem;}
.badge-item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:1.25rem 0.75rem;border-radius:18px;border:1px solid var(--border);background:rgba(10,12,26,0.55);transition:all 0.25s;text-align:center;}
.badge-item.unlocked{border-color:rgba(108,99,255,0.4);background:rgba(108,99,255,0.06);}
.badge-item.unlocked:hover{border-color:var(--accent);box-shadow:0 0 24px rgba(108,99,255,0.2);transform:translateY(-2px);}
.badge-item.locked{opacity:0.3;filter:grayscale(1);}
.badge-circle{
  width:64px;height:64px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:28px;
  background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.08);
}
.badge-item.unlocked .badge-circle{
  border-color:rgba(108,99,255,0.5);
  box-shadow:0 0 20px rgba(108,99,255,0.3);
  background:rgba(108,99,255,0.1);
}
.badge-name{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--text);line-height:1.3;}
.badge-desc{font-size:10px;color:var(--muted);line-height:1.4;}
.badge-unlocked-tag{font-size:10px;font-weight:700;color:var(--accent3);margin-top:2px;}
.badge-locked-tag{font-size:10px;color:var(--muted);}

@media(max-width:600px){
  *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.1s!important;}
  .profile-hero{flex-direction:column;align-items:flex-start;}
  .badge-grid{grid-template-columns:repeat(3,1fr);}
  .stat-grid{grid-template-columns:1fr!important;}
  .navbar{padding:0 1.25rem;}
  .nav-links{display:none;}
  .nav-links.mobile-open{display:flex;flex-direction:column;position:fixed;top:64px;left:0;right:0;background:rgba(4,5,13,0.97);backdrop-filter:blur(20px);padding:1rem;gap:4px;border-bottom:1px solid var(--border);z-index:99;}
  .nav-hamburger{display:block;}
  .orb{display:none;}
  #star-canvas{display:none;}
  .grid-overlay{display:none;}
  .page-wrap{padding:72px 0.75rem 2rem;}
  .card,.stat-card,.xp-card,.chart-card{padding:1rem;}
  body{font-size:14px;}
}
</style>
</head>
<body>

<canvas id="star-canvas"></canvas>
<div class="grid-overlay"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<!-- Loading -->
<div id="prof-loading">
  <div class="spinner"></div>
  <span class="loading-text">Loading profile…</span>
</div>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="nav-brand" href="/">
    <div class="nav-logo-wrap">
      <div class="nav-logo-inner">
        <div class="logo-glow-nav"></div>
        <div class="logo-svg-wrap">
          <div class="logo-ring lr1"></div>
          <div class="logo-ring lr2"></div>
          <div class="logo-ring lr3"></div>
          <div class="logo-core-circle">
            <svg class="logo-icon-svg" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="3" fill="rgba(200,195,255,0.9)"/>
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10" stroke="rgba(108,99,255,0.8)" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M12 6v6l4 2" stroke="rgba(0,210,255,0.8)" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="logo-orbit-dot"></div>
          <div class="logo-orbit-dot2"></div>
        </div>
      </div>
    </div>
    <span class="nav-brand-text">ScrollBye</span>
  </a>

  <div class="nav-links">
    <a class="nav-link" href="/dashboard">Dashboard</a>
    <a class="nav-link active" href="/profile">Profile</a>
    <a class="nav-link" href="/survey" onclick="event.preventDefault();goToSurvey();">Take Survey</a>
  </div>

  <div class="nav-right">
    <a href="/profile" id="nav-avatar-wrap"></a>
    <a class="nav-logout-btn" href="/auth/logout">Logout</a>
  </div>
  <button class="nav-hamburger" id="nav-hamburger" onclick="toggleMobileNav()" aria-label="Menu">☰</button>
</nav>

<!-- PAGE -->
<div class="page-wrap" id="profile-page" style="display:none;">

  <!-- Profile Hero -->
  <div class="section-eyebrow"><span class="eyebrow-dot"></span>My Profile</div>
  <div class="profile-hero">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;">
      <div class="avatar-wrap">
        <div id="avatar-display"></div>
        <div class="avatar-camera-overlay" onclick="document.getElementById('avatar-file-input').click()">📷</div>
        <input type="file" id="avatar-file-input" accept="image/*">
      </div>
      <div class="upload-status" id="upload-status"></div>
    </div>
    <div class="profile-info">
      <div class="profile-username" id="prof-username"></div>
      <div class="xp-level-badge"><span class="xp-pip"></span><span id="prof-level-name">Dormant</span> — Level <span id="prof-level-num">1</span></div>
      <div class="profile-joined" id="prof-joined"></div>
    </div>
  </div>

  <!-- XP Bar -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;">
      <span style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;">⚡ Experience Points</span>
      <span id="prof-xp-label" style="font-size:13px;color:var(--muted);"></span>
    </div>
    <div class="xp-bar-track"><div class="xp-bar-fill" id="prof-xp-bar"></div></div>
    <div class="xp-bar-row" style="margin-top:6px;margin-bottom:0;">
      <span id="prof-xp-min"></span>
      <span id="prof-xp-next"></span>
    </div>
  </div>

  <!-- Stat tiles -->
  <div class="stat-grid">
    <div class="stat-tile">
      <div class="stat-tile-label">Total XP</div>
      <div class="stat-tile-value accent-purple" id="st-xp">0</div>
      <div class="stat-tile-sub">points earned</div>
    </div>
    <div class="stat-tile">
      <div class="stat-tile-label">Current Streak</div>
      <div class="stat-tile-value accent-gold" id="st-streak">0</div>
      <div class="stat-tile-sub">days in a row</div>
    </div>
    <div class="stat-tile">
      <div class="stat-tile-label">Days Logged</div>
      <div class="stat-tile-value accent-blue" id="st-days">0</div>
      <div class="stat-tile-sub">total surveys</div>
    </div>
    <div class="stat-tile">
      <div class="stat-tile-label">Personal Best FSI</div>
      <div class="stat-tile-value accent-green" id="st-best-fsi">—</div>
      <div class="stat-tile-sub">focus score</div>
    </div>
  </div>

  <!-- FSI Sparkline -->
  <div class="card">
    <div class="chart-title">📈 Last 7 Focus Scores</div>
    <div class="chart-wrap"><canvas id="sparkline-chart"></canvas></div>
  </div>

  <!-- Badges -->
  <div class="card">
    <div class="badge-section-title">🏅 Achievement Badges</div>
    <div class="badge-grid" id="badge-grid"></div>
  </div>

</div><!-- /page-wrap -->

<script>
// ── Star canvas ──────────────────────────────────────────────
(function(){
  var c=document.getElementById('star-canvas');
  var ctx=c.getContext('2d');
  var stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
  function initStars(){var n=window.innerWidth<600?40:180;stars=[];for(var i=0;i<n;i++){stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.2+0.2,a:Math.random(),s:Math.random()*0.003+0.001});}}
  function draw(){ctx.clearRect(0,0,c.width,c.height);for(var s of stars){ctx.save();ctx.globalAlpha=s.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.restore();s.a+=s.s;if(s.a>1||s.a<0)s.s=-s.s;}requestAnimationFrame(draw);}
  window.addEventListener('resize',function(){resize();initStars();});
  resize();initStars();draw();
})();
function toggleMobileNav(){document.querySelector('.nav-links').classList.toggle('mobile-open');}

// ── Level system ─────────────────────────────────────────────
var LEVELS=[
  {level:1,name:'Dormant',min:0},
  {level:2,name:'Awakening',min:100},
  {level:3,name:'Aware',min:250},
  {level:4,name:'Focused',min:450},
  {level:5,name:'Disciplined',min:700},
  {level:6,name:'Sharp',min:1000},
  {level:7,name:'Elite',min:1350},
  {level:8,name:'Sovereign',min:1750},
  {level:9,name:'Transcendent',min:2200},
  {level:10,name:'ScrollBye Legend',min:2700}
];
function getLevelInfo(xp){
  var info=LEVELS[0];
  for(var l of LEVELS){if(xp>=l.min)info=l;}
  var next=LEVELS.find(function(l){return l.min>xp;});
  return Object.assign({},info,{nextMin:next?next.min:null});
}

// ── Avatar upload ────────────────────────────────────────────
document.getElementById('avatar-file-input').addEventListener('change',function(e){
  var file=e.target.files[0];
  if(!file)return;
  var status=document.getElementById('upload-status');
  status.textContent='Uploading…';
  var fd=new FormData();
  fd.append('avatar',file);
  fetch('/api/upload-avatar',{method:'POST',body:fd})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.ok){
        renderAvatarDisplay(d.avatar,null);
        renderNavAvatar(d.avatar,null);
        status.textContent='✓ Avatar updated';
        setTimeout(function(){status.textContent='';},3000);
      } else {
        status.style.color='var(--accent2)';
        status.textContent='Upload failed: '+(d.error||'unknown error');
      }
    })
    .catch(function(){status.style.color='var(--accent2)';status.textContent='Upload failed';});
});

// ── Badge definitions ────────────────────────────────────────
var BADGES=[
  {id:'first_log',   emoji:'🌱', name:'First Log',          desc:'Complete your first survey',             color:'#43E97B'},
  {id:'week_warrior',emoji:'🔥', name:'Week Warrior',        desc:'Reach a 7-day streak',                   color:'#FF6B6B'},
  {id:'sleep_champ', emoji:'💤', name:'Sleep Champion',      desc:'Log 8+ hours sleep in a survey',         color:'#00D2FF'},
  {id:'focus_master',emoji:'🎯', name:'Focus Master',        desc:'Achieve FSI above 80',                   color:'#6C63FF'},
  {id:'consistency', emoji:'🏆', name:'Consistency King',    desc:'Log 30 total days',                      color:'#FFD700'},
  {id:'legend',      emoji:'⚡', name:'ScrollBye Legend',    desc:'Reach Level 10 (2700 XP)',               color:'#9B94FF'},
  {id:'challenger',  emoji:'⚔️', name:'First Blood',         desc:'Send your first challenge',               color:'#FF6B6B'},
  {id:'winner',      emoji:'🥇', name:'Challenge Winner',    desc:'Win a head-to-head challenge',            color:'#FFD700'},
  {id:'unbeaten',    emoji:'👑', name:'Unbeaten',            desc:'Win 5 challenges in a row',               color:'#FFD700'},
  {id:'night_owl',   emoji:'🦉', name:'Night Owl',           desc:'Log after 11 PM',                        color:'#9B94FF'},
  {id:'early_bird',  emoji:'🌅', name:'Early Bird',          desc:'Log before 7 AM',                        color:'#FFB347'},
  {id:'no_phone',    emoji:'📵', name:'Phone Free',          desc:'Zero phone checks during study',          color:'#43E97B'},
  {id:'passive_zero',emoji:'🧘', name:'Digital Detox',       desc:'Log 0 passive screen hours',             color:'#43E97B'},
  {id:'sleep_week',  emoji:'🛌', name:'Sleep Streak',        desc:'Sleep 8+ hrs for 7 days straight',       color:'#00D2FF'},
  {id:'global',      emoji:'🌍', name:'Global Citizen',      desc:'Top 10 on global leaderboard',           color:'#00D2FF'},
  {id:'comeback',    emoji:'💪', name:'Comeback Kid',        desc:'Improve FSI by 20+ points',              color:'#FF6B6B'},
  {id:'perfect_week',emoji:'⭐', name:'Perfect Week',        desc:'Log every day for 7 days',               color:'#FFD700'},
  {id:'researcher',  emoji:'🔬', name:'Researcher',          desc:'Fill all optional survey fields',        color:'#9B94FF'},
  {id:'social',      emoji:'📣', name:'Spread the Word',     desc:'Share ScrollBye with 3 friends',         color:'#FF6B6B'},
  {id:'top_fsi',     emoji:'🧠', name:'Peak Performance',    desc:'Achieve FSI of 90 or above',             color:'#6C63FF'}
];

function checkBadges(logs,xp,streak,level,badgeData,myChallenges){
  var unlocked={};
  var daysLogged=logs?logs.length:0;
  badgeData=badgeData||{};
  var created=(myChallenges&&myChallenges.created)||[];
  var responded=(myChallenges&&myChallenges.responded)||[];

  // ── Original 6 ──────────────────────────────────────────────
  if(daysLogged>=1) unlocked['first_log']=true;
  if(streak>=7) unlocked['week_warrior']=true;
  if(logs){for(var i=0;i<logs.length;i++){if(parseFloat(logs[i].sleepHours)>=8){unlocked['sleep_champ']=true;break;}}}
  if(logs){for(var i=0;i<logs.length;i++){if(parseFloat(logs[i].fsi||0)>80){unlocked['focus_master']=true;break;}}}
  if(daysLogged>=30) unlocked['consistency']=true;
  if(level>=10) unlocked['legend']=true;

  // ── New 14 ──────────────────────────────────────────────────
  // challenger: created at least one challenge
  if(created.length>0||(badgeData.challengesCreated||0)>0) unlocked['challenger']=true;

  // winner: won any challenge
  if((badgeData.challengesWon||0)>0) unlocked['winner']=true;
  if(!unlocked['winner']){
    for(var i=0;i<responded.length;i++){
      var r=responded[i];
      if(r.won||(parseFloat(r.myFsi||0)>parseFloat((r.challenge||{}).challengerFSI||0))){unlocked['winner']=true;break;}
    }
  }

  // unbeaten: 5+ consecutive wins
  if((badgeData.consecutiveWins||0)>=5) unlocked['unbeaten']=true;

  // night_owl: any log submitted after 11 PM
  if(logs){for(var i=0;i<logs.length;i++){var ts=logs[i].timestamp||logs[i].createdAt;if(ts&&new Date(ts).getHours()>=23){unlocked['night_owl']=true;break;}}}

  // early_bird: any log submitted 4–7 AM
  if(logs){for(var i=0;i<logs.length;i++){var ts=logs[i].timestamp||logs[i].createdAt;if(ts){var h=new Date(ts).getHours();if(h>=4&&h<=7){unlocked['early_bird']=true;break;}}}}

  // no_phone: any log with phoneChecks === 0
  if(logs){for(var i=0;i<logs.length;i++){if(parseInt(logs[i].phoneChecks)===0){unlocked['no_phone']=true;break;}}}

  // passive_zero: any log with passiveHours === 0
  if(logs){for(var i=0;i<logs.length;i++){if(parseFloat(logs[i].passiveHours)===0){unlocked['passive_zero']=true;break;}}}

  // sleep_week: last 7 logs all have sleep >= 8
  if(logs&&logs.length>=7){var last7=logs.slice(-7);if(last7.every(function(l){return parseFloat(l.sleepHours)>=8;})){unlocked['sleep_week']=true;}}

  // global: top 10 on leaderboard
  if(badgeData.isTop10) unlocked['global']=true;

  // comeback: any two consecutive logs with FSI improvement >= 20
  if(logs&&logs.length>=2){for(var i=1;i<logs.length;i++){var prev=parseFloat(logs[i-1].fsi)||0,curr=parseFloat(logs[i].fsi)||0;if(curr-prev>=20){unlocked['comeback']=true;break;}}}

  // perfect_week: streak >= 7
  if(streak>=7) unlocked['perfect_week']=true;

  // researcher: any log has all key fields filled in
  if(logs){for(var i=0;i<logs.length;i++){var l=logs[i];if(l.studyHours!=null&&l.studyHours!==''&&l.focusQuality!=null&&l.focusQuality!==''&&l.mood!=null&&l.mood!==''&&l.phoneChecks!=null&&l.phoneChecks!==''){unlocked['researcher']=true;break;}}}

  // social: 3+ shares tracked server-side
  if((badgeData.socialShares||0)>=3) unlocked['social']=true;

  // top_fsi: any log with FSI >= 90
  if(logs){for(var i=0;i<logs.length;i++){if(parseFloat(logs[i].fsi)>=90){unlocked['top_fsi']=true;break;}}}

  return unlocked;
}

function renderBadges(unlockedMap){
  var grid=document.getElementById('badge-grid');
  grid.innerHTML='';
  BADGES.forEach(function(b){
    var isUnlocked=!!unlockedMap[b.id];
    var div=document.createElement('div');
    div.className='badge-item '+(isUnlocked?'unlocked':'locked');
    div.innerHTML=
      '<div class="badge-circle" style="'+(isUnlocked?'border-color:'+b.color+';box-shadow:0 0 20px '+b.color+'40;background:'+b.color+'18;':'')+'">'+b.emoji+'</div>'+
      '<div class="badge-name">'+b.name+'</div>'+
      '<div class="badge-desc">'+b.desc+'</div>'+
      (isUnlocked?'<div class="badge-unlocked-tag">✓ Unlocked</div>':'<div class="badge-locked-tag">🔒 Locked</div>');
    grid.appendChild(div);
  });
}

// ── Sparkline chart ──────────────────────────────────────────
var sparkChart=null;
function renderSparkline(fsiValues){
  var canvas=document.getElementById('sparkline-chart');
  var labels=fsiValues.map(function(_,i){return 'Day '+(i+1);});
  if(sparkChart)sparkChart.destroy();
  sparkChart=new Chart(canvas,{
    type:'line',
    data:{
      labels:labels,
      datasets:[{
        label:'FSI',
        data:fsiValues,
        borderColor:'rgba(108,99,255,0.9)',
        backgroundColor:'rgba(108,99,255,0.08)',
        pointBackgroundColor:'rgba(108,99,255,1)',
        pointBorderColor:'rgba(108,99,255,0.5)',
        pointRadius:5,
        pointHoverRadius:7,
        borderWidth:2.5,
        tension:0.35,
        fill:true
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      animation:{duration:400},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ' FSI: '+ctx.parsed.y;}}}},
      scales:{
        x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'rgba(220,220,255,0.4)',font:{size:11}}},
        y:{min:0,max:100,grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'rgba(220,220,255,0.4)',font:{size:11},stepSize:20}}
      }
    }
  });
}

// ── Main init ────────────────────────────────────────────────
(function(){
  Promise.all([fetch('/api/me'),fetch('/api/my-progress'),fetch('/api/my-submissions'),fetch('/api/my-badge-data'),fetch('/api/my-challenges')])
    .then(function(rs){return Promise.all(rs.map(function(r){return r.json().catch(function(){return {};})}));})
    .then(function(data){
      var me=data[0], prog=data[1], subsData=data[2], badgeData=data[3]||{}, myChallenges=data[4]||{};
      if(!me.loggedIn){location.href='/login?next=/profile';return;}

      // Nav avatar
      renderNavAvatar(me.avatar||null, me.username);
      // Inject Challenges nav link
      (function(){var nav=document.querySelector('.nav-links');if(nav&&!nav.querySelector('[href="/challenges"]')){var cl=document.createElement('a');cl.className='nav-link';cl.href='/challenges';cl.textContent='Challenges';nav.insertBefore(cl,nav.children[Math.min(2,nav.children.length)]);}}());

      // Use server submissions — server is the source of truth
      var xp   = prog&&prog.loggedIn?prog.xp:0;
      var streak=prog&&prog.loggedIn?prog.streak:0;
      var levelInfo=getLevelInfo(xp);

      var logs=subsData&&subsData.submissions?subsData.submissions:[];
      var daysLogged=logs.length;

      // Best FSI
      var bestFsi=0;
      logs.forEach(function(l){
        var f=parseInt(l.fsi)||0;
        if(f>bestFsi)bestFsi=f;
      });

      // Render avatar
      renderAvatarDisplay(me.avatar||null, me.username);

      // Profile hero
      document.getElementById('prof-username').textContent='@'+me.username;
      document.getElementById('prof-level-name').textContent=levelInfo.name;
      document.getElementById('prof-level-num').textContent=levelInfo.level;
      if(prog&&prog.loggedIn&&prog.lastLogDate){
        // use account creation date if available
      }
      // Joined date
      if(me.createdAt){
        var joinDate=new Date(me.createdAt);
        document.getElementById('prof-joined').textContent='Member since '+joinDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});
      } else {
        document.getElementById('prof-joined').textContent='Member since ScrollBye';
      }

      // XP bar
      var pct=levelInfo.nextMin?Math.round(((xp-levelInfo.min)/(levelInfo.nextMin-levelInfo.min))*100):100;
      pct=Math.max(0,Math.min(100,pct));
      document.getElementById('prof-xp-bar').style.width=pct+'%';
      document.getElementById('prof-xp-label').textContent=xp+' XP';
      document.getElementById('prof-xp-min').textContent=levelInfo.name+' ('+levelInfo.min+')';
      document.getElementById('prof-xp-next').textContent=levelInfo.nextMin?'Next: '+levelInfo.nextMin+' XP':'MAX LEVEL';

      // Stat tiles
      document.getElementById('st-xp').textContent=xp.toLocaleString();
      document.getElementById('st-streak').textContent=streak;
      document.getElementById('st-days').textContent=daysLogged;
      document.getElementById('st-best-fsi').textContent=bestFsi>0?bestFsi:'—';

      // Sparkline — last 7 FSI values from logs
      var fsiHistory=[];
      if(logs&&logs.length>0){
        var recent=logs.slice(-7);
        recent.forEach(function(l){
          var f=parseInt(l.fsi)||0;
          // Compute FSI inline if not stored directly
          if(!l.fsi&&l.passiveHours!=null){
            var passive=parseFloat(l.passiveHours)||0,active=parseFloat(l.activeHours)||0;
            var sleep=parseFloat(l.sleepHours)||7.5,study=parseFloat(l.studyHours)||0;
            var mood=parseInt(l.mood)||3,focus=parseInt(l.focusQuality)||3,acad=parseInt(l.academicPerformance)||6;
            var checks=parseInt(l.phoneChecks)||0;
            var S=Math.max(0,Math.min(100,Math.round(100-(passive*15)+Math.min(active*5,20))));
            var sm={4:0,4.5:10,5:20,5.5:35,6:50,6.5:63,7:75,7.5:88,8:100,8.5:95,9:88,9.5:80,10:75,10.5:68,11:60};
            var L=sm[sleep]!==undefined?sm[sleep]:75;
            var M=Math.round((mood/5)*100);
            var ss2=[0,20,40,55,65,75,85,92,100];
            var si=Math.min(Math.floor(study*2),8);
            var F=Math.max(0,ss2[si]+(focus-1)*5-checks*2);
            var A=acad*10;
            f=Math.round(0.25*S+0.20*L+0.20*M+0.20*F+0.15*A);
          }
          fsiHistory.push(Math.max(0,Math.min(100,f)));
        });
      }
      if(fsiHistory.length===0){
        fsiHistory=[0];
      }
      renderSparkline(fsiHistory);

      // Badges
      var unlockedMap=checkBadges(logs,xp,streak,levelInfo.level,badgeData,myChallenges);
      renderBadges(unlockedMap);

      // Show page
      document.getElementById('prof-loading').style.display='none';
      document.getElementById('profile-page').style.display='block';
    })
    .catch(function(){location.href='/login?next=/profile';});
})();

function goToSurvey(){
  fetch('/api/my-progress').then(function(r){return r.json();}).then(function(prog){
    location.href=(prog.loggedIn&&prog.lastLogDate)?'/log-today':'/survey';
  }).catch(function(){location.href='/survey';});
}
